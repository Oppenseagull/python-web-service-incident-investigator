services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: fault_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-items.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d fault_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: lab
      POSTGRES_DB: fault_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FAULT_LAB_ENABLED: ${FAULT_LAB_ENABLED:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
